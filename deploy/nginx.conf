# Include inside the existing nginx http {} context.
# Install ONLY after confirming paths and certificate availability on the target VPS.
# Certificates must cover BOTH hostnames before the alias HTTPS server is enabled.
server {
    listen 80;
    server_name artemiskit.vorbtech.com.ng akit.vorbtech.com.ng;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://artemiskit.vorbtech.com.ng$request_uri; }
}
server {
    listen 443 ssl;
    server_name akit.vorbtech.com.ng;
    ssl_certificate /etc/letsencrypt/live/artemiskit.vorbtech.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemiskit.vorbtech.com.ng/privkey.pem;
    return 301 https://artemiskit.vorbtech.com.ng$request_uri;
}
server {
    listen 443 ssl;
    server_name artemiskit.vorbtech.com.ng;
    ssl_certificate /etc/letsencrypt/live/artemiskit.vorbtech.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemiskit.vorbtech.com.ng/privkey.pem;
    root /srv/artemiskit/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /pagefind/ { add_header Cache-Control "public, max-age=3600"; }
    location = /health.txt { add_header Cache-Control no-store; }
    error_page 404 /404.html;
}
